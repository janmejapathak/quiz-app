<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Quiz Master</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f0e17;
            --surface: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.15);
            --primary: #6c63ff;
            --primary-light: #a29bfe;
            --secondary: #00cec9;
            --accent: #fd79a8;
            --success: #00b894;
            --danger: #d63031;
            --text: #fffffe;
            --text-muted: #a7a9be;
            --radius: 16px;
            --easy: #00b894;
            --medium: #fdcb6e;
            --hard: #e17055;
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 20% 30%, rgba(108,99,255,0.2) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(0,206,201,0.15) 0%, transparent 50%);
            color: var(--text);
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        .start-screen { text-align: center; }
        .start-screen .icon { font-size: 4rem; margin-bottom: 1rem; }

        .difficulty-buttons, .category-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }

        .difficulty-btn, .category-btn {
            padding: 0.7rem 1.8rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s;
            letter-spacing: 0.5px;
        }

        .difficulty-btn.active, .category-btn.active {
            border-color: transparent;
            color: #0f0e17;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .difficulty-btn[data-difficulty="easy"].active { background: var(--easy); }
        .difficulty-btn[data-difficulty="medium"].active { background: var(--medium); }
        .difficulty-btn[data-difficulty="hard"].active { background: var(--hard); }
        .category-btn.active { background: var(--primary-light); color: #0f0e17; }

        .start-btn {
            padding: 1rem 3rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(108,99,255,0.4);
            margin-top: 1rem;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(108,99,255,0.6);
        }

        .quiz-screen .progress {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .timer-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 6px;
            transition: width 0.1s linear;
        }

        .question {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .option-btn {
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            color: var(--text);
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .option-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.1);
            border-color: var(--primary);
            transform: translateX(5px);
        }
        .option-btn.correct {
            background: rgba(0,184,148,0.2);
            border-color: var(--success);
            color: #55efc4;
        }
        .option-btn.incorrect {
            background: rgba(214,48,49,0.2);
            border-color: var(--danger);
            color: #fab1a0;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .feedback {
            text-align: center;
            font-weight: 600;
            margin: 0.5rem 0;
            min-height: 1.5rem;
        }
        .feedback.correct { color: #55efc4; }
        .feedback.incorrect { color: #fab1a0; }

        .end-screen { text-align: center; }
        .end-screen h2 { font-size: 2rem; margin-bottom: 0.5rem; color: var(--secondary); }
        .score-display { font-size: 3rem; font-weight: 800; color: var(--primary-light); margin: 1rem 0; }

        .high-scores { margin: 1.5rem 0; text-align: left; }
        .high-scores h3 { color: var(--text-muted); margin-bottom: 0.5rem; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        .score-list { list-style: none; }
        .score-list li {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: var(--text-muted);
        }
        .score-list li:first-child { color: var(--secondary); font-weight: 600; }

        .buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
        .btn {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 999px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 15px rgba(108,99,255,0.3);
        }
        .btn-primary:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(108,99,255,0.5); }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }

        .name-input { margin-top: 1rem; }
        .name-input input {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            margin-right: 0.5rem;
        }
        .name-input input:focus { border-color: var(--primary); }

        .streak-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.1);
            color: var(--accent);
            font-weight: 600;
            margin-left: 0.5rem;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .container { padding: 1rem; }
            .header h1 { font-size: 2rem; }
            .question { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Ultimate Quiz</h1>
            <p>Choose difficulty, category & test your knowledge</p>
        </div>

        <!-- Start Screen -->
        <div class="screen start-screen active" id="startScreen">
            <div class="icon">🧠</div>
            <h2>Select Difficulty</h2>
            <div class="difficulty-buttons" id="difficultyButtons">
                <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
                <button class="difficulty-btn" data-difficulty="medium">Medium</button>
                <button class="difficulty-btn" data-difficulty="hard">Hard</button>
            </div>
            <h2>Select Category</h2>
            <div class="category-buttons" id="categoryButtons">
                <button class="category-btn active" data-category="all">All</button>
                <button class="category-btn" data-category="general">General</button>
                <button class="category-btn" data-category="science">Science</button>
                <button class="category-btn" data-category="history">History</button>
                <button class="category-btn" data-category="geography">Geography</button>
            </div>
            <button class="start-btn" id="startBtn">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div class="screen quiz-screen" id="quizScreen">
            <div class="progress">
                <span id="questionCount">Question 1/10</span>
                <span>Score: <span id="scoreDisplay">0</span> <span class="streak-badge" id="streakDisplay">🔥 Streak: 0</span></span>
            </div>
            <div class="timer-bar">
                <div class="timer-fill" id="timerFill"></div>
            </div>
            <div class="question" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="feedback" id="feedback"></div>
        </div>

        <!-- End Screen -->
        <div class="screen end-screen" id="endScreen">
            <h2>Quiz Complete!</h2>
            <div class="score-display" id="finalScore">0</div>
            <div class="high-scores">
                <h3>High Scores (This Difficulty)</h3>
                <ul class="score-list" id="scoreList"></ul>
            </div>
            <div class="name-input" id="nameInput" style="display:none;">
                <input type="text" id="playerName" placeholder="Enter your name" maxlength="20">
                <button class="btn btn-primary" id="saveScoreBtn">Save Score</button>
            </div>
            <div class="buttons">
                <button class="btn btn-primary" id="playAgainBtn">Play Again</button>
                <button class="btn btn-secondary" id="homeBtn">Home</button>
            </div>
        </div>
    </div>

    <script>
        const questionBank = {
            easy: [
                { category: 'general', question: 'What is the capital of France?', options: ['London', 'Berlin', 'Paris', 'Madrid'], correct: 2 },
                { category: 'general', question: 'Which planet is known as the Red Planet?', options: ['Venus', 'Mars', 'Jupiter', 'Saturn'], correct: 1 },
                { category: 'general', question: 'What is the largest ocean on Earth?', options: ['Atlantic', 'Indian', 'Arctic', 'Pacific'], correct: 3 },
                { category: 'general', question: 'Who wrote "Romeo and Juliet"?', options: ['Charles Dickens', 'William Shakespeare', 'Mark Twain', 'Jane Austen'], correct: 1 },
                { category: 'general', question: 'What is the chemical symbol for water?', options: ['H2O', 'CO2', 'NaCl', 'O2'], correct: 0 },
                { category: 'general', question: 'Which year did World War II end?', options: ['1943', '1944', '1945', '1946'], correct: 2 },
                { category: 'general', question: 'What is the tallest mammal?', options: ['Elephant', 'Giraffe', 'Horse', 'Camel'], correct: 1 },
                { category: 'general', question: 'Which country invented pizza?', options: ['France', 'Spain', 'Italy', 'Greece'], correct: 2 },
                { category: 'general', question: 'What is the square root of 144?', options: ['10', '11', '12', '13'], correct: 2 },
                { category: 'general', question: 'Which language has the most native speakers?', options: ['English', 'Hindi', 'Mandarin Chinese', 'Spanish'], correct: 2 },
                { category: 'science', question: 'What is the speed of light?', options: ['300,000 km/s', '150,000 km/s', '500,000 km/s', '100,000 km/s'], correct: 0 },
                { category: 'science', question: 'Which gas do plants absorb?', options: ['Oxygen', 'Carbon Dioxide', 'Nitrogen', 'Hydrogen'], correct: 1 },
                { category: 'science', question: 'What is the hardest natural substance?', options: ['Gold', 'Iron', 'Diamond', 'Quartz'], correct: 2 },
                { category: 'science', question: 'How many bones are in the human body?', options: ['206', '205', '210', '200'], correct: 0 },
                { category: 'science', question: 'What is the chemical symbol for gold?', options: ['Go', 'Gd', 'Au', 'Ag'], correct: 2 },
                { category: 'history', question: 'Who was the first President of the United States?', options: ['Thomas Jefferson', 'George Washington', 'Abraham Lincoln', 'John Adams'], correct: 1 },
                { category: 'history', question: 'In which year did the Titanic sink?', options: ['1912', '1905', '1915', '1920'], correct: 0 },
                { category: 'history', question: 'Which ancient civilization built the pyramids?', options: ['Romans', 'Greeks', 'Egyptians', 'Mayans'], correct: 2 },
                { category: 'history', question: 'The Renaissance began in which country?', options: ['France', 'England', 'Italy', 'Germany'], correct: 2 },
                { category: 'history', question: 'Who discovered America?', options: ['Christopher Columbus', 'Vasco da Gama', 'Ferdinand Magellan', 'James Cook'], correct: 0 },
                { category: 'geography', question: 'What is the largest continent?', options: ['Africa', 'Asia', 'Europe', 'North America'], correct: 1 },
                { category: 'geography', question: 'Which river is the longest?', options: ['Amazon', 'Nile', 'Yangtze', 'Mississippi'], correct: 1 },
                { category: 'geography', question: 'Mount Everest is in which mountain range?', options: ['Andes', 'Himalayas', 'Alps', 'Rockies'], correct: 1 },
                { category: 'geography', question: 'Which country has the most islands?', options: ['Indonesia', 'Sweden', 'Philippines', 'Japan'], correct: 1 },
                { category: 'geography', question: 'The Sahara Desert is primarily in which continent?', options: ['Asia', 'Africa', 'Australia', 'South America'], correct: 1 }
            ],
            medium: [
                { category: 'general', question: 'What is the largest organ in the human body?', options: ['Liver', 'Skin', 'Brain', 'Heart'], correct: 1 },
                { category: 'general', question: 'Which planet has the most moons?', options: ['Jupiter', 'Saturn', 'Uranus', 'Neptune'], correct: 1 },
                { category: 'general', question: 'What is the national animal of India?', options: ['Tiger', 'Lion', 'Elephant', 'Leopard'], correct: 0 },
                { category: 'general', question: 'Which is the smallest prime number?', options: ['0', '1', '2', '3'], correct: 2 },
                { category: 'general', question: 'In which year did the Berlin Wall fall?', options: ['1987', '1989', '1991', '1993'], correct: 1 },
                { category: 'science', question: 'What is the powerhouse of the cell?', options: ['Nucleus', 'Mitochondria', 'Ribosome', 'Golgi body'], correct: 1 },
                { category: 'science', question: 'Which planet is known as the Morning Star?', options: ['Venus', 'Mars', 'Mercury', 'Jupiter'], correct: 0 },
                { category: 'science', question: 'What is the pH of pure water?', options: ['5', '6', '7', '8'], correct: 2 },
                { category: 'science', question: 'What is the chemical formula for table salt?', options: ['KCl', 'NaCl', 'CaCl2', 'MgCl2'], correct: 1 },
                { category: 'history', question: 'Who painted the Mona Lisa?', options: ['Michelangelo', 'Leonardo da Vinci', 'Raphael', 'Donatello'], correct: 1 },
                { category: 'history', question: 'The Great Wall of China was primarily built to protect against which group?', options: ['Mongols', 'Japanese', 'Koreans', 'Russians'], correct: 0 },
                { category: 'history', question: 'In which year did India gain independence?', options: ['1945', '1946', '1947', '1948'], correct: 2 },
                { category: 'geography', question: 'Which country is known as the Land of the Rising Sun?', options: ['China', 'South Korea', 'Japan', 'Thailand'], correct: 2 },
                { category: 'geography', question: 'The Amazon River flows through which continent?', options: ['Africa', 'South America', 'Asia', 'Australia'], correct: 1 },
                { category: 'geography', question: 'What is the smallest country in the world?', options: ['Monaco', 'Vatican City', 'San Marino', 'Liechtenstein'], correct: 1 }
            ],
            hard: [
                { category: 'general', question: 'What is the hardest known natural material?', options: ['Diamond', 'Graphene', 'Titanium', 'Quartz'], correct: 0 },
                { category: 'general', question: 'Who developed the theory of general relativity?', options: ['Isaac Newton', 'Albert Einstein', 'Niels Bohr', 'Galileo Galilei'], correct: 1 },
                { category: 'general', question: 'What is the capital of Australia?', options: ['Sydney', 'Melbourne', 'Canberra', 'Brisbane'], correct: 2 },
                { category: 'general', question: 'Which element has the chemical symbol "W"?', options: ['Tungsten', 'Wolfram', 'Tin', 'Titanium'], correct: 0 },
                { category: 'science', question: 'What is the most abundant gas in the Earth\'s atmosphere?', options: ['Oxygen', 'Carbon Dioxide', 'Nitrogen', 'Argon'], correct: 2 },
                { category: 'science', question: 'What is the study of fungi called?', options: ['Botany', 'Mycology', 'Zoology', 'Microbiology'], correct: 1 },
                { category: 'science', question: 'Which particle has a negative charge?', options: ['Proton', 'Neutron', 'Electron', 'Positron'], correct: 2 },
                { category: 'history', question: 'The Hundred Years\' War was fought between which two countries?', options: ['England and France', 'France and Spain', 'Germany and England', 'Italy and France'], correct: 0 },
                { category: 'history', question: 'Who was the first Roman Emperor?', options: ['Julius Caesar', 'Augustus', 'Nero', 'Caligula'], correct: 1 },
                { category: 'history', question: 'The ancient city of Petra is located in which modern country?', options: ['Jordan', 'Egypt', 'Israel', 'Syria'], correct: 0 },
                { category: 'geography', question: 'What is the deepest point in the ocean?', options: ['Mariana Trench', 'Tonga Trench', 'Java Trench', 'Puerto Rico Trench'], correct: 0 },
                { category: 'geography', question: 'Which mountain is the highest peak in Africa?', options: ['Mount Kilimanjaro', 'Mount Kenya', 'Ras Dashen', 'Mount Stanley'], correct: 0 },
                { category: 'geography', question: 'The Atacama Desert is located in which continent?', options: ['Africa', 'Asia', 'South America', 'Australia'], correct: 2 }
            ]
        };

        let selectedDifficulty = 'easy';
        let selectedCategory = 'all';
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let streak = 0;
        let timerInterval = null;
        let timeLeft = 15;
        const maxTime = { easy: 15, medium: 10, hard: 5 };
        let isAnswered = false;

        const startScreen = document.getElementById('startScreen');
        const quizScreen = document.getElementById('quizScreen');
        const endScreen = document.getElementById('endScreen');
        const startBtn = document.getElementById('startBtn');
        const difficultyBtns = document.querySelectorAll('.difficulty-btn');
        const categoryBtns = document.querySelectorAll('.category-btn');
        const questionCount = document.getElementById('questionCount');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const streakDisplay = document.getElementById('streakDisplay');
        const timerFill = document.getElementById('timerFill');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedback = document.getElementById('feedback');
        const finalScore = document.getElementById('finalScore');
        const scoreList = document.getElementById('scoreList');
        const nameInput = document.getElementById('nameInput');
        const playerName = document.getElementById('playerName');
        const saveScoreBtn = document.getElementById('saveScoreBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const homeBtn = document.getElementById('homeBtn');

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function selectQuestions() {
            let pool = questionBank[selectedDifficulty] || questionBank.easy;
            if (selectedCategory !== 'all') {
                pool = pool.filter(q => q.category === selectedCategory);
            }
            pool = shuffleArray([...pool]);
            currentQuestions = pool.slice(0, 10);
            if (currentQuestions.length < 10) {
                const extra = shuffleArray([...questionBank[selectedDifficulty]].filter(q => !currentQuestions.includes(q))).slice(0, 10 - currentQuestions.length);
                currentQuestions = [...currentQuestions, ...extra];
            }
        }

        function showScreen(screen) {
            [startScreen, quizScreen, endScreen].forEach(s => s.classList.remove('active'));
            screen.classList.add('active');
        }

        function startQuiz() {
            currentIndex = 0;
            score = 0;
            streak = 0;
            isAnswered = false;
            selectQuestions();
            showScreen(quizScreen);
            displayQuestion();
        }

        function displayQuestion() {
            const q = currentQuestions[currentIndex];
            questionCount.textContent = `Question ${currentIndex + 1}/${currentQuestions.length} (${selectedDifficulty.toUpperCase()})`;
            scoreDisplay.textContent = score;
            streakDisplay.textContent = `🔥 Streak: ${streak}`;
            questionText.innerHTML = q.question;
            optionsContainer.innerHTML = '';
            feedback.textContent = '';
            isAnswered = false;
            timeLeft = maxTime[selectedDifficulty] || 15;
            updateTimerBar();

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.addEventListener('click', () => selectAnswer(idx));
                optionsContainer.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerBar();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (!isAnswered) {
                        const correct = currentQuestions[currentIndex].correct;
                        markAnswer(null, correct);
                    }
                }
            }, 1000);
        }

        function updateTimerBar() {
            const percent = (timeLeft / (maxTime[selectedDifficulty] || 15)) * 100;
            timerFill.style.width = percent + '%';
            if (percent <= 20) timerFill.style.background = 'linear-gradient(90deg, #d63031, #fab1a0)';
            else timerFill.style.background = 'linear-gradient(90deg, #6c63ff, #00cec9)';
        }

        function selectAnswer(selected) {
            if (isAnswered) return;
            clearInterval(timerInterval);
            const correct = currentQuestions[currentIndex].correct;
            markAnswer(selected, correct);
        }

        function markAnswer(selected, correct) {
            isAnswered = true;
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === correct) btn.classList.add('correct');
                else if (i === selected) btn.classList.add('incorrect');
            });
            if (selected === correct) {
                streak++;
                const bonus = streak > 1 ? 1 : 0;
                score += 1 + bonus;
                feedback.textContent = `Correct! +${1 + bonus} (Streak ${streak})`;
                feedback.className = 'feedback correct';
            } else {
                streak = 0;
                feedback.textContent = 'Incorrect!';
                feedback.className = 'feedback incorrect';
            }
            scoreDisplay.textContent = score;
            streakDisplay.textContent = `🔥 Streak: ${streak}`;

            setTimeout(() => {
                if (currentIndex < currentQuestions.length - 1) {
                    currentIndex++;
                    displayQuestion();
                } else {
                    endQuiz();
                }
            }, 1200);
        }

        function endQuiz() {
            clearInterval(timerInterval);
            finalScore.textContent = `${score} / ${currentQuestions.length}`;
            showScreen(endScreen);
            renderHighScores();
            const key = getStorageKey();
            const highScores = getHighScores(key);
            if (highScores.length < 5 || score > highScores[highScores.length - 1].score) {
                nameInput.style.display = 'block';
                playerName.value = '';
                playerName.focus();
                saveScoreBtn.onclick = () => saveScore(score);
            } else {
                nameInput.style.display = 'none';
            }
        }

        function getStorageKey() {
            return `quizHighScores_${selectedDifficulty}`;
        }

        function getHighScores(key) {
            return JSON.parse(localStorage.getItem(key)) || [];
        }

        function saveScore(score) {
            const name = playerName.value.trim() || 'Anonymous';
            const key = getStorageKey();
            let highScores = getHighScores(key);
            highScores.push({ name, score, date: new Date().toLocaleDateString() });
            highScores.sort((a, b) => b.score - a.score);
            highScores = highScores.slice(0, 5);
            localStorage.setItem(key, JSON.stringify(highScores));
            nameInput.style.display = 'none';
            renderHighScores();
            alert('Score saved!');
        }

        function renderHighScores() {
            const key = getStorageKey();
            const highScores = getHighScores(key);
            scoreList.innerHTML = '';
            if (highScores.length === 0) {
                scoreList.innerHTML = '<li>No scores yet for this difficulty</li>';
                return;
            }
            highScores.forEach((entry, i) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${i + 1}. ${entry.name}</span><span>${entry.score} pts</span>`;
                scoreList.appendChild(li);
            });
        }

        difficultyBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                difficultyBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedDifficulty = btn.dataset.difficulty;
                renderHighScores();
            });
        });

        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedCategory = btn.dataset.category;
            });
        });

        startBtn.addEventListener('click', startQuiz);
        playAgainBtn.addEventListener('click', startQuiz);
        homeBtn.addEventListener('click', () => {
            showScreen(startScreen);
            renderHighScores();
        });

        renderHighScores();
    </script>
</body>
</html>
